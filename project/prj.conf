# 编译优化
CONFIG_SPEED_OPTIMIZATIONS=y

# 日志系统
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_FLUSH_SLEEP_US=100

# 调试相关
CONFIG_DEBUG_THREAD_INFO=y
CONFIG_DEBUG=y

# 堆栈大小
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_IDLE_STACK_SIZE=1024
CONFIG_ISR_STACK_SIZE=2048
CONFIG_INPUT_THREAD_STACK_SIZE=2048
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048

# 基础支持
CONFIG_INIT_STACKS=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_REBOOT=y
CONFIG_HEAP_MEM_POOL_SIZE=81920

# GPIO / PWM / ADC
CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_ADC=y

# 按键输入 (gpio-keys)
CONFIG_INPUT=y
CONFIG_INPUT_GPIO_KEYS=y

# Flash 与 Settings (NVS) + MCUboot OTA
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# I2C & HUSB238
CONFIG_I2C=y
CONFIG_HUSB238_DRIVER=y

# Display (SSD1306 128x32 OLED)
CONFIG_DISPLAY=y

# Wi-Fi 配置
CONFIG_WIFI=y
CONFIG_WIFI_NM=y
CONFIG_WIFI_ESP32=y
CONFIG_WIFI_USAGE_MODE_STA_AP=y
CONFIG_ESP32_PHY_MAX_TX_POWER=14
CONFIG_ESP32_WIFI_STA_SCAN_ALL=y
CONFIG_ESP32_WIFI_STA_POWER_SAVE_NONE=y
CONFIG_ESP32_WIFI_AMPDU_TX_ENABLED=n
CONFIG_ESP32_WIFI_AMPDU_RX_ENABLED=n
CONFIG_WIFI_STA_AUTO_DHCPV4=n

# 网络协议栈
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IF_MAX_IPV4_COUNT=2
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=64
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_INITIAL_DELAY_MAX=2
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="FAN01"
CONFIG_NET_DHCPV4_SERVER=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y
CONFIG_NET_MAX_CONTEXTS=16
CONFIG_NET_MAX_CONN=16
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=4096

# Network buffers
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64

# ZVFS / HTTP Server
CONFIG_EVENTFD=y
CONFIG_ZVFS_EVENTFD_MAX=16
CONFIG_ZVFS_POLL_MAX=24
CONFIG_HTTP_PARSER=y
CONFIG_HTTP_PARSER_URL=y
CONFIG_HTTP_SERVER=y
CONFIG_HTTP_SERVER_MAX_CLIENTS=8
CONFIG_HTTP_SERVER_CLIENT_INACTIVITY_TIMEOUT=5
CONFIG_HTTP_SERVER_COMPRESSION=y

# Shell
CONFIG_SHELL=y
CONFIG_NET_SHELL=y
CONFIG_NET_L2_WIFI_SHELL=y
